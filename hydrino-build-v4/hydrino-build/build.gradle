plugins { id "fabric-loom" version "1.14-SNAPSHOT" }

base { archivesName = "hydrino" }
version = "1.0.0"

repositories {
    maven { name = "meteor-maven"; url = "https://maven.meteordev.org/releases" }
    maven { name = "meteor-maven-snapshots"; url = "https://maven.meteordev.org/snapshots" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
